<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Depths Saviors Verification</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131a; color: #eef3f8; font: 16px/1.5 Inter, system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 48px)); padding: 32px; border: 1px solid #2f4050; border-radius: 16px; background: #17212b; text-align: center; }
    button { box-sizing: border-box; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 8px; background: #66d9c4; color: #0e1b20; cursor: pointer; font: inherit; font-weight: 700; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.5em; margin-top: 16px; color: #bed0dc; }
    a { color: #66d9c4; }
  </style>
</head>
<body>
  <main>
    <h1>Server verification</h1>
    <p id="identity">Checking your Discord session…</p>
    <button id="verify" type="button" hidden>Complete verification</button>
    <p id="status" role="status"></p>
    <p><a href="/privacy">Privacy information</a></p>
  </main>
  <script>
    (() => {
      const apiBase = localStorage.getItem('ds_api_url') || (
        location.hostname === 'localhost' || location.hostname === '127.0.0.1'
          ? 'http://localhost:8080/api'
          : 'https://api.deepsaviors.xyz/api'
      );
      const apiOrigin = apiBase.replace(/\/api$/, '');
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const guildId = params.get('guild');
      const userId = params.get('user');
      const sig = params.get('sig');
      const identity = document.getElementById('identity');
      const status = document.getElementById('status');
      const verify = document.getElementById('verify');
      let csrfToken = null;

      if (!token || !/^\d{17,20}$/.test(guildId || '') || !/^\d{17,20}$/.test(userId || '') || !/^[a-f0-9]{64}$/i.test(sig || '')) {
        identity.textContent = 'This verification link is invalid or expired. Ask a server administrator for a new one.';
        return;
      }

      function browserIdentifier() {
        const key = 'ds_verify_browser_id';
        let value = localStorage.getItem(key);
        if (!value) {
          value = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16)).join('-');
          localStorage.setItem(key, value);
        }
        return value;
      }

      async function loadSession() {
        const response = await fetch(apiOrigin + '/auth/session', { credentials: 'include', mode: 'cors' });
        return response.ok ? response.json() : null;
      }

      loadSession().then(session => {
        if (!session || !session.user) {
          identity.textContent = 'Sign in with Discord to verify this link.';
          const login = document.createElement('button');
          login.type = 'button';
          login.textContent = 'Sign in with Discord';
          login.addEventListener('click', () => {
            location.assign(apiOrigin + '/auth/login?return_to=' + encodeURIComponent(location.href));
          });
          identity.after(login);
          return;
        }
        csrfToken = session.csrf_token;
        identity.textContent = 'Signed in as ' + (session.user.username || 'your Discord account') + '.';
        verify.hidden = false;
      }).catch(() => {
        identity.textContent = 'The verification service is unavailable. Contact server staff for manual review.';
      });

      verify.addEventListener('click', async () => {
        verify.disabled = true;
        status.textContent = 'Submitting verification…';
        try {
          const response = await fetch(apiBase + '/verify', {
            method: 'POST', credentials: 'include', mode: 'cors',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken || '' },
            body: JSON.stringify({ token, guildId, userId, sig, fingerprint: browserIdentifier() }),
          });
          if (!response.ok) throw new Error(await response.text());
          status.textContent = 'Verification sent. You may return to Discord.';
          verify.hidden = true;
        } catch (error) {
          status.textContent = error.message || 'Verification could not be completed. Contact server staff.';
          verify.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
