<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Deepsaviors Verification</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131a; color: #eef3f8; font: 16px/1.5 Inter, system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 48px)); padding: 32px; border: 1px solid #2f4050; border-radius: 16px; background: #17212b; text-align: center; }
    input, button { box-sizing: border-box; width: 100%; margin-top: 14px; padding: 12px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #506477; background: #10131a; color: #eef3f8; }
    button { border: 0; background: #66d9c4; color: #0e1b20; cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.5em; margin-top: 16px; color: #bed0dc; }
    a { color: #66d9c4; }
  </style>
</head>
<body>
  <main>
    <h1>Discord-native verification</h1>
    <p>Enter the one-time code sent to you by server staff in a Discord DM. This page does not collect browser, device, fingerprint, hardware, or network metadata.</p>
    <p id="identity">Checking your Discord session…</p>
    <form id="verify-form" hidden>
      <label for="code">One-time code</label>
      <input id="code" name="code" autocomplete="one-time-code" maxlength="256" required>
      <button id="submit" type="submit">Complete verification</button>
    </form>
    <p id="status" role="status"></p>
    <p><a href="/privacy">Privacy information</a></p>
  </main>
  <script>
    (() => {
      const apiBase = localStorage.getItem('ds_api_url') || (
        location.hostname === 'localhost' || location.hostname === '127.0.0.1'
          ? 'http://localhost:8080/api'
          : 'https://api.deepsaviors.xyz/api'
      );
      const apiOrigin = apiBase.replace(/\/api$/, '');
      const guildId = new URLSearchParams(location.search).get('guild');
      const identity = document.getElementById('identity');
      const form = document.getElementById('verify-form');
      const status = document.getElementById('status');
      const submit = document.getElementById('submit');
      let csrfToken = null;

      if (!/^\d{17,20}$/.test(guildId || '')) {
        identity.textContent = 'This verification link is invalid. Ask server staff for a new code.';
        return;
      }

      async function loadSession() {
        const response = await fetch(apiOrigin + '/auth/session', { credentials: 'include', mode: 'cors' });
        if (!response.ok) return null;
        return response.json();
      }

      loadSession().then(session => {
        if (!session || !session.user) {
          identity.textContent = 'Sign in with Discord before entering your code.';
          const login = document.createElement('button');
          login.type = 'button';
          login.textContent = 'Sign in with Discord';
          login.addEventListener('click', () => {
            location.assign(apiOrigin + '/auth/login?return_to=' + encodeURIComponent(location.href));
          });
          identity.after(login);
          return;
        }
        csrfToken = session.csrf_token;
        identity.textContent = 'Signed in as ' + (session.user.username || 'your Discord account') + '.';
        form.hidden = false;
      }).catch(() => {
        identity.textContent = 'The verification service is unavailable. Contact server staff for manual review.';
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const code = document.getElementById('code').value.trim();
        if (!code) return;
        submit.disabled = true;
        status.textContent = 'Checking your one-time code…';
        try {
          const response = await fetch(apiBase + '/verify', {
            method: 'POST',
            credentials: 'include',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken || '' },
            body: JSON.stringify({ guild_id: guildId, code }),
          });
          const payload = await response.json();
          const messages = {
            verified: 'Verification complete. You may return to Discord.',
            expired: 'That code expired. Ask staff to issue a new one.',
            attempt_limit: 'That code is locked after five attempts. Ask staff to issue a new one.',
            invalid: 'That code is invalid or has already been used.',
          };
          status.textContent = messages[payload.status] || 'Verification could not be completed. Contact staff for manual review.';
          if (payload.status === 'verified') form.hidden = true;
        } catch (_) {
          status.textContent = 'The verification service is unavailable. Contact server staff for manual review.';
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
